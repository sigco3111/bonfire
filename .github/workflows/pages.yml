name: Deploy Bonfire Example to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Enable web platform
        working-directory: example
        run: flutter create . --platforms=web

      - name: Add flame 1.37 override (Bonfire compatibility)
        working-directory: example
        run: |
          if ! grep -q "dependency_overrides" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "dependency_overrides:" >> pubspec.yaml
            echo "  flame: 1.37.0" >> pubspec.yaml
          fi
          cat pubspec.yaml | grep -A2 dependency_overrides

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example web (with wasm fallback)
        working-directory: example
        run: |
          flutter build web --release --wasm --base-href "/bonfire/" 2>&1 || \
          (echo "WASM build failed, falling back to standard build" && \
           flutter build web --release --no-wasm-dry-run --base-href "/bonfire/")

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
